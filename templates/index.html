<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoSphere AI</title>
<style>
  :root {
    --primary: #1f7a4d;
    --primary-dark: #155c3a;
    --bg: #f2f4f7;
    --bubble-user: #1f7a4d;
    --bubble-bot: #ffffff;
    --text-dark: #1f2d2a;
    --text-light: #6b7a76;
    --border: #e2e6e9;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chat-container {
    width: 100%;
    max-width: 480px;
    height: 90vh;
    max-height: 720px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-header {
    background: var(--primary);
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .chat-header .icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .chat-header .title {
    font-weight: 600;
    font-size: 17px;
  }

  .chat-header .subtitle {
    font-size: 12px;
    opacity: 0.85;
  }

  .chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .message {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .message.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    color: var(--text-dark);
    border-bottom-left-radius: 4px;
  }

  .message.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .message.typing {
    align-self: flex-start;
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    color: var(--text-light);
    font-style: italic;
  }

  .chat-input {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--border);
    background: #fff;
  }

  .chat-input input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 24px;
    border: 1px solid var(--border);
    outline: none;
    font-size: 14px;
  }

  .chat-input input:focus {
    border-color: var(--primary);
  }

  .chat-input button {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s ease;
    flex-shrink: 0;
  }

  .chat-input button:hover {
    background: var(--primary-dark);
  }

  .chat-input button:disabled {
    background: #b7c0c6;
    cursor: not-allowed;
  }
</style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <div class="icon">🌍</div>
      <div>
        <div class="title">EcoSphere AI</div>
        <div class="subtitle">Your world & environment guide</div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message bot">Hi, I'm EcoSphere AI 🌍 Ask me anything about countries, geography, climate, or the natural world.</div>
    </div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Ask about geography, climate, nature..." autocomplete="off">
      <button id="sendBtn" title="Send">➤</button>
    </div>
  </div>

<script>
  const chatMessages = document.getElementById("chatMessages");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(text, sender) {
    const bubble = document.createElement("div");
    bubble.classList.add("message", sender);
    bubble.textContent = text;
    chatMessages.appendChild(bubble);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return bubble;
  }

  function showTyping() {
    const bubble = document.createElement("div");
    bubble.classList.add("message", "bot", "typing");
    bubble.textContent = "EcoSphere AI is typing...";
    bubble.id = "typingIndicator";
    chatMessages.appendChild(bubble);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function removeTyping() {
    const typing = document.getElementById("typingIndicator");
    if (typing) {
      typing.remove();
    }
  }

  async function sendMessage() {
    const message = userInput.value.trim();
    if (!message) {
      return;
    }

    addMessage(message, "user");
    userInput.value = "";
    sendBtn.disabled = true;
    showTyping();

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message })
      });

      const data = await response.json();
      removeTyping();

      if (response.ok) {
        addMessage(data.reply, "bot");
      } else {
        addMessage(data.error || "Something went wrong. Please try again.", "bot");
      }
    } catch (err) {
      removeTyping();
      addMessage("Network error. Please check your connection and try again.", "bot");
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      sendMessage();
    }
  });
</script>

</body>
</html>
